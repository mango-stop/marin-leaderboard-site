<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>marin 팀 리더보드</title>
<style>
  :root {
    --bg: #f6f8fa;
    --surface: #ffffff;
    --ink: #17232e;
    --ink-soft: #5a6b7a;
    --line: #dde4ea;
    --accent: #0b6e99;
    --accent-ink: #ffffff;
    --gold: #b8860b;
    --baseline: #8a94a0;
    --error: #b3402a;
    --up: #1a7f4b;
    --down: #b3402a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10171d;
      --surface: #18222b;
      --ink: #e3ecf3;
      --ink-soft: #93a4b3;
      --line: #2a3843;
      --accent: #3aa2cc;
      --accent-ink: #0c1318;
      --gold: #d9a72e;
      --baseline: #7c8894;
      --error: #e07a5f;
      --up: #4cc98a;
      --down: #e07a5f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10171d;
    --surface: #18222b;
    --ink: #e3ecf3;
    --ink-soft: #93a4b3;
    --line: #2a3843;
    --accent: #3aa2cc;
    --accent-ink: #0c1318;
    --gold: #d9a72e;
    --baseline: #7c8894;
    --error: #e07a5f;
    --up: #4cc98a;
    --down: #e07a5f;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.55 -apple-system, "Apple SD Gothic Neo", "Pretendard",
      "Noto Sans KR", "Segoe UI", sans-serif;
  }
  header {
    background: var(--surface); border-bottom: 1px solid var(--line);
    padding: 22px clamp(16px, 4vw, 40px) 0;
  }
  h1 { font-size: 21px; letter-spacing: -0.01em; }
  h1 .wave { color: var(--accent); }
  .sub { color: var(--ink-soft); font-size: 13px; margin: 4px 0 16px; }
  nav { display: flex; gap: 4px; }
  nav button {
    appearance: none; border: 0; background: none; color: var(--ink-soft);
    font: inherit; font-weight: 600; padding: 9px 14px; cursor: pointer;
    border-bottom: 2.5px solid transparent;
  }
  nav button:hover { color: var(--ink); }
  nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  nav button.on { color: var(--accent); border-bottom-color: var(--accent); }
  main { max-width: 980px; margin: 0 auto; padding: 22px clamp(12px, 4vw, 40px) 60px; }
  .meta-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .chip {
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 14px; font-size: 13px; color: var(--ink-soft);
  }
  .chip b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .tablewrap {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    overflow-x: auto;
  }
  table { border-collapse: collapse; width: 100%; min-width: 640px; }
  th, td { padding: 10px 14px; text-align: left; border-top: 1px solid var(--line); }
  thead th {
    border-top: 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink-soft); background: color-mix(in srgb, var(--surface) 88%, var(--bg));
  }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.rank { font-weight: 700; width: 3.2em; text-align: right; }
  tr.top1 td.rank { color: var(--gold); }
  td.score { font-weight: 700; }
  tr.baseline td { color: var(--baseline); }
  tr.baseline td.score { font-weight: 600; }
  .flag {
    display: inline-block; font-size: 11px; font-weight: 700; border-radius: 4px;
    padding: 1px 7px; margin-left: 7px; vertical-align: 1px;
    background: color-mix(in srgb, var(--baseline) 18%, transparent);
    color: var(--baseline);
  }
  .memo { color: var(--ink-soft); font-size: 13.5px; max-width: 30ch; }
  .file { color: var(--ink-soft); font-size: 12.5px; font-family: ui-monospace, monospace; }
  .date { color: var(--ink-soft); font-size: 13px; white-space: nowrap; }
  .toggle { margin: 14px 2px; font-size: 13.5px; color: var(--ink-soft); }
  .toggle input { accent-color: var(--accent); vertical-align: -2px; margin-right: 6px; }
  .errors { margin-top: 14px; font-size: 13.5px; color: var(--error); }
  .errors code { font-family: ui-monospace, monospace; }
  .note { margin-top: 22px; font-size: 12.5px; color: var(--ink-soft); max-width: 68ch; }
  .empty { padding: 34px; text-align: center; color: var(--ink-soft); }
</style>
</head>
<body>
<header>
  <h1><span class="wave">〜</span> marin 팀 리더보드</h1>
  <p class="sub" id="stamp">불러오는 중…</p>
  <nav id="tabs" role="tablist"></nav>
</header>
<main>
  <div class="meta-row" id="chips"></div>
  <div class="tablewrap"><table>
    <thead><tr>
      <th class="num">순위</th><th>제출자</th><th class="num" id="score-head">점수</th>
      <th>메모</th><th>파일</th><th>제출 시각</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <label class="toggle"><input type="checkbox" id="showAll">제출 이력 전체 보기
    (기본: 제출자별 최고 점수만)</label>
  <div class="errors" id="errors"></div>
  <p class="note">채점은 주최측 score.py의 검증·지표를 그대로 사용하되, 공식 test 정답이
  비공개이므로 train에서 분리한 팀 검증셋 기준입니다. ⚑ 베이스라인은 팀 검증셋에서 다시
  계산한 값이라 공식 안내 수치와 다릅니다.</p>
</main>
<script>
const TASKS = ["P1", "P2", "P3"];
let board = null, current = "P1";

function fmtScore(t, v) { return v.toFixed(6); }

function render() {
  const t = board.tasks[current];
  const showAll = document.getElementById("showAll").checked;
  document.getElementById("score-head").textContent =
    t.metric + (t.unit ? ` (${t.unit})` : "") + (t.higher_better ? " ↑" : " ↓");
  const best = new Set(t.best_by_submitter);
  const ok = t.entries.filter(e => e.status === "ok")
    .sort((a, b) => a.rank - b.rank)
    .filter(e => showAll || best.has(e.file));
  const rows = document.getElementById("rows");
  rows.innerHTML = "";
  if (!ok.length) {
    rows.innerHTML = '<tr><td colspan="6" class="empty">아직 제출이 없습니다 — ' +
      'submissions/' + current + '/ 에 CSV를 push 하세요.</td></tr>';
  }
  for (const e of ok) {
    const tr = document.createElement("tr");
    if (e.rank === 1) tr.classList.add("top1");
    if (e.is_baseline) tr.classList.add("baseline");
    tr.innerHTML =
      `<td class="num rank">${e.rank}</td>` +
      `<td>${esc(e.submitter)}${e.is_baseline ? '<span class="flag">기준선</span>' : ''}</td>` +
      `<td class="num score">${fmtScore(t, e.score)}</td>` +
      `<td class="memo">${esc(e.memo || "")}</td>` +
      `<td class="file">${esc(e.file)}</td>` +
      `<td class="date">${e.submitted_at.slice(0, 16).replace("T", " ")}</td>`;
    rows.appendChild(tr);
  }
  const errs = t.entries.filter(e => e.status === "error");
  document.getElementById("errors").innerHTML = errs.map(e =>
    `⚠️ <code>${esc(e.file)}</code> 채점 실패 — ${esc(e.error)}`).join("<br>");
  const okAll = t.entries.filter(e => e.status === "ok" && !e.is_baseline);
  const baseline = t.entries.find(e => e.is_baseline && e.status === "ok");
  const bestEntry = t.entries.filter(e => e.status === "ok").find(e => e.rank === 1);
  document.getElementById("chips").innerHTML =
    `<span class="chip">${t.name} · 지표 <b>${t.metric}${t.unit ? " (" + t.unit + ")" : ""}</b></span>` +
    `<span class="chip">제출 <b>${okAll.length}</b>건</span>` +
    (bestEntry ? `<span class="chip">1위 <b>${fmtScore(t, bestEntry.score)}</b> · ${esc(bestEntry.submitter)}</span>` : "") +
    (baseline ? `<span class="chip">팀 기준선 <b>${fmtScore(t, baseline.score)}</b></span>` : "") +
    `<span class="chip">공식 기준선(참고) <b>${t.official_baseline}</b></span>`;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function selectTab(task) {
  current = task;
  document.querySelectorAll("#tabs button").forEach(b =>
    b.classList.toggle("on", b.dataset.task === task));
  render();
}

async function init() {
  const tabs = document.getElementById("tabs");
  try {
    board = await (await fetch("leaderboard.json?_=" + Date.now())).json();
  } catch (e) {
    document.getElementById("stamp").textContent =
      "leaderboard.json을 불러오지 못했습니다 — 첫 채점 실행 전이거나 배포 오류입니다.";
    return;
  }
  document.getElementById("stamp").textContent =
    "갱신 " + board.generated_at.slice(0, 16).replace("T", " ") +
    " (KST) · 팀 검증셋 기준 자동 채점";
  for (const task of TASKS) {
    const t = board.tasks[task];
    if (!t) continue;
    const b = document.createElement("button");
    b.dataset.task = task;
    b.textContent = `${task} ${t.name}`;
    b.onclick = () => selectTab(task);
    tabs.appendChild(b);
  }
  document.getElementById("showAll").onchange = render;
  selectTab("P1");
}
init();
</script>
</body>
</html>
