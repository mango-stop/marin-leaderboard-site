<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>marin 팀 리더보드</title>
<style>
  :root {
    --bg: #f5f7fa;
    --surface: #ffffff;
    --ink: #101828;
    --ink-2: #51607a;
    --ink-3: #8a97ad;
    --line: #e4e9f1;
    --line-soft: #edf1f6;
    --blue: #1d4ed8;
    --blue-strong: #1e40af;
    --blue-soft: #eff4ff;
    --blue-line: #c7d7fe;
    --gold: #9a6b15;
    --danger: #b42318;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 8px 24px -12px rgba(16, 24, 40, 0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c1220; --surface: #131a2b; --ink: #e8edf6; --ink-2: #9daabf;
      --ink-3: #6b7891; --line: #232d42; --line-soft: #1b2438;
      --blue: #6d9bff; --blue-strong: #8fb2ff; --blue-soft: #16233e; --blue-line: #2c4370;
      --gold: #d5a441; --danger: #f97066;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c1220; --surface: #131a2b; --ink: #e8edf6; --ink-2: #9daabf;
    --ink-3: #6b7891; --line: #232d42; --line-soft: #1b2438;
    --blue: #6d9bff; --blue-strong: #8fb2ff; --blue-soft: #16233e; --blue-line: #2c4370;
    --gold: #d5a441; --danger: #f97066;
    --shadow: none;
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
      "Pretendard Variable", Pretendard, "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
    font-feature-settings: "tnum";
  }
  .shell { max-width: 1020px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 44px); }

  header { padding-top: 44px; }
  .eyebrow {
    font-size: 11.5px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--blue);
  }
  h1 {
    font-size: clamp(24px, 3.4vw, 30px); font-weight: 800;
    letter-spacing: -0.022em; margin-top: 6px; text-wrap: balance;
  }
  .stamp { margin-top: 8px; font-size: 13.5px; color: var(--ink-2); }
  .stamp b { color: var(--ink); font-weight: 600; }

  nav {
    margin-top: 28px; display: flex; gap: 26px;
    border-bottom: 1px solid var(--line);
  }
  nav button {
    appearance: none; border: 0; background: none; padding: 0 2px 13px;
    font: inherit; font-size: 14.5px; font-weight: 600; color: var(--ink-2);
    cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  nav button:hover { color: var(--ink); }
  nav button:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 3px; }
  nav button.on { color: var(--blue); border-bottom-color: var(--blue); }
  nav button .t-code { font-weight: 800; margin-right: 7px; }

  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px; margin: 26px 0 22px;
  }
  .stat {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px 12px; box-shadow: var(--shadow);
  }
  .stat .k {
    font-size: 11px; font-weight: 700; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--ink-3);
  }
  .stat .v {
    margin-top: 5px; font-size: 19px; font-weight: 700; letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums; color: var(--ink);
  }
  .stat .v small { font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin-left: 5px; }
  .stat.lead .v { color: var(--blue); }

  .board {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); overflow: hidden;
  }
  .board-scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 660px; }
  th, td { padding: 12px 18px; text-align: left; }
  thead th {
    font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--ink-3); border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--surface) 60%, var(--bg));
    white-space: nowrap;
  }
  tbody td { border-bottom: 1px solid var(--line-soft); }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: color-mix(in srgb, var(--blue-soft) 45%, transparent); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.rank { width: 3.4em; font-weight: 700; color: var(--ink-2); }
  tr.top1 td.rank, tr.top1 td.who { color: var(--blue); }
  tr.top1 td.score { color: var(--blue-strong); }
  td.who { font-weight: 600; white-space: nowrap; }
  td.score { font-weight: 700; letter-spacing: -0.01em; }
  tr.baseline td { color: var(--ink-3); }
  tr.baseline td.score { font-weight: 600; }
  .tag {
    display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.05em;
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px;
    margin-left: 8px; vertical-align: 1.5px; color: var(--ink-3);
  }
  td.memo { color: var(--ink-2); font-size: 13.5px; max-width: 32ch; }
  td.file { color: var(--ink-3); font-size: 12px; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  td.date { color: var(--ink-3); font-size: 13px; white-space: nowrap; }
  .empty { padding: 44px; text-align: center; color: var(--ink-2); }

  .below {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 10px; margin: 14px 2px 0;
  }
  .toggle { font-size: 13.5px; color: var(--ink-2); cursor: pointer; user-select: none; }
  .toggle input { accent-color: var(--blue); vertical-align: -2px; margin-right: 7px; }
  .metric-hint { font-size: 12.5px; color: var(--ink-3); }

  .errors { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
  .error-item {
    border: 1px solid color-mix(in srgb, var(--danger) 32%, var(--line));
    background: color-mix(in srgb, var(--danger) 6%, var(--surface));
    border-radius: 10px; padding: 10px 14px; font-size: 13.5px; color: var(--ink-2);
  }
  .error-item b { color: var(--danger); font-weight: 700; margin-right: 8px; }
  .error-item code { font-family: ui-monospace, Menlo, monospace; color: var(--ink); }

  footer {
    margin: 34px 0 56px; padding-top: 18px; border-top: 1px solid var(--line);
    font-size: 12.5px; color: var(--ink-3); max-width: 72ch;
  }
  footer a { color: var(--blue); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="shell">
  <header>
    <p class="eyebrow">Marin · Team Leaderboard</p>
    <h1>해양과학 AI 경진대회 팀 리더보드</h1>
    <p class="stamp" id="stamp">불러오는 중</p>
    <nav id="tabs" role="tablist" aria-label="문제 선택"></nav>
  </header>

  <section class="stats" id="stats"></section>

  <section class="board"><div class="board-scroll">
    <table>
      <thead><tr>
        <th class="num">순위</th><th>제출자</th><th class="num" id="score-head">점수</th>
        <th>메모</th><th>파일</th><th>제출 시각</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div></section>

  <div class="below">
    <label class="toggle"><input type="checkbox" id="showAll">제출 이력 전체 보기</label>
    <span class="metric-hint" id="metric-hint"></span>
  </div>

  <div class="errors" id="errors"></div>

  <footer>
    채점은 주최측 score.py의 검증 게이트와 지표 수식을 그대로 사용하며, 공식 test 정답이
    비공개이므로 train에서 분리한 팀 검증셋 기준입니다. 기준선 행은 팀 검증셋에서 다시 계산한
    값이라 공식 안내 수치와 다릅니다. 제출 방법은 팀 repo의
    <a href="https://github.com/mango-stop/marin-leaderboard" rel="noopener">CLAUDE.md / README</a>를
    참고하세요.
  </footer>
</div>

<script>
const TASKS = ["P1", "P2", "P3"];
let board = null, current = "P1";

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
const f6 = v => v.toFixed(6);

function render() {
  const t = board.tasks[current];
  const showAll = document.getElementById("showAll").checked;
  const unit = t.unit ? ` (${t.unit})` : "";
  document.getElementById("score-head").textContent = t.metric + unit;
  document.getElementById("metric-hint").textContent =
    `${t.metric}${unit} · ${t.higher_better ? "높을수록" : "낮을수록"} 좋음 · 기본 보기는 제출자별 최고 점수`;

  const best = new Set(t.best_by_submitter);
  const ok = t.entries.filter(e => e.status === "ok")
    .sort((a, b) => a.rank - b.rank)
    .filter(e => showAll || best.has(e.file));
  const rows = document.getElementById("rows");
  rows.innerHTML = "";
  if (!ok.length) {
    rows.innerHTML = `<tr><td colspan="6" class="empty">아직 제출이 없습니다 —
      팀 repo의 submissions/${current}/ 에 CSV를 push 하세요.</td></tr>`;
  }
  for (const e of ok) {
    const tr = document.createElement("tr");
    if (e.rank === 1) tr.classList.add("top1");
    if (e.is_baseline) tr.classList.add("baseline");
    tr.innerHTML =
      `<td class="num rank">${e.rank}</td>` +
      `<td class="who">${esc(e.submitter)}${e.is_baseline ? '<span class="tag">기준선</span>' : ""}</td>` +
      `<td class="num score">${f6(e.score)}</td>` +
      `<td class="memo">${esc(e.memo || "")}</td>` +
      `<td class="file">${esc(e.file)}</td>` +
      `<td class="date">${e.submitted_at.slice(0, 16).replace("T", " ")}</td>`;
    rows.appendChild(tr);
  }

  document.getElementById("errors").innerHTML =
    t.entries.filter(e => e.status === "error").map(e =>
      `<div class="error-item"><b>채점 실패</b><code>${esc(e.file)}</code> — ${esc(e.error)}</div>`
    ).join("");

  const okReal = t.entries.filter(e => e.status === "ok" && !e.is_baseline);
  const baseline = t.entries.find(e => e.is_baseline && e.status === "ok");
  const top = t.entries.filter(e => e.status === "ok").find(e => e.rank === 1);
  document.getElementById("stats").innerHTML =
    `<div class="stat lead"><div class="k">1위 ${t.metric}</div>
       <div class="v">${top ? f6(top.score) : "–"}${top ? `<small>${esc(top.submitter)}</small>` : ""}</div></div>` +
    `<div class="stat"><div class="k">팀 기준선</div>
       <div class="v">${baseline ? f6(baseline.score) : "–"}</div></div>` +
    `<div class="stat"><div class="k">공식 기준선 · 참고</div>
       <div class="v">${t.official_baseline}</div></div>` +
    `<div class="stat"><div class="k">제출 수</div>
       <div class="v">${okReal.length}<small>건</small></div></div>`;
}

function selectTab(task) {
  current = task;
  document.querySelectorAll("#tabs button").forEach(b =>
    b.classList.toggle("on", b.dataset.task === task));
  render();
}

async function init() {
  try {
    board = await (await fetch("leaderboard.json?_=" + Date.now())).json();
  } catch (e) {
    document.getElementById("stamp").textContent =
      "leaderboard.json을 불러오지 못했습니다 — 첫 채점 실행 전이거나 배포 오류입니다.";
    return;
  }
  document.getElementById("stamp").innerHTML =
    `마지막 갱신 <b>${board.generated_at.slice(0, 16).replace("T", " ")}</b> KST · 팀 검증셋 기준 자동 채점`;
  const tabs = document.getElementById("tabs");
  for (const task of TASKS) {
    const t = board.tasks[task];
    if (!t) continue;
    const b = document.createElement("button");
    b.dataset.task = task;
    b.setAttribute("role", "tab");
    b.innerHTML = `<span class="t-code">${task}</span>${esc(t.name)}`;
    b.onclick = () => selectTab(task);
    tabs.appendChild(b);
  }
  document.getElementById("showAll").onchange = render;
  selectTab("P1");
}
init();
</script>
</body>
</html>
