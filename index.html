<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChangCv 팀 리더보드</title>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --ink: #131c28;
    --ink-2: #4d5c70;
    --ink-3: #86929f;
    --line: #e2e7ed;
    --line-soft: #eef1f5;
    --blue: #1a56db;
    --blue-strong: #16429e;
    --blue-wash: #f0f5ff;
    --danger: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e141d; --surface: #151d29; --ink: #e7ecf3; --ink-2: #a2aebd;
      --ink-3: #6d7a8a; --line: #26303e; --line-soft: #1d2634;
      --blue: #7aa5ff; --blue-strong: #a3c0ff; --blue-wash: #18233a;
      --danger: #f28b82;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e141d; --surface: #151d29; --ink: #e7ecf3; --ink-2: #a2aebd;
    --ink-3: #6d7a8a; --line: #26303e; --line-soft: #1d2634;
    --blue: #7aa5ff; --blue-strong: #a3c0ff; --blue-wash: #18233a;
    --danger: #f28b82;
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--ink); word-break: keep-all;
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
      "Pretendard Variable", Pretendard, "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
  }
  .shell { max-width: 1000px; margin: 0 auto; padding: 0 clamp(14px, 4vw, 40px); }

  header { padding-top: clamp(26px, 6vw, 44px); }
  .brand {
    display: inline-block; font-size: 13px; font-weight: 800; color: var(--blue);
    border: 1px solid color-mix(in srgb, var(--blue) 35%, var(--line));
    background: var(--blue-wash); border-radius: 6px; padding: 3px 9px;
    letter-spacing: 0.02em;
  }
  h1 {
    margin-top: 12px; font-size: clamp(21px, 4.6vw, 28px); font-weight: 800;
    letter-spacing: -0.02em; text-wrap: balance;
  }
  .stamp { margin-top: 7px; font-size: 13px; color: var(--ink-3); }
  .stamp b { color: var(--ink-2); font-weight: 600; }

  nav {
    margin-top: 22px; display: flex; gap: clamp(14px, 3vw, 26px);
    border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none;
  }
  nav::-webkit-scrollbar { display: none; }
  nav button {
    appearance: none; border: 0; background: none; padding: 0 1px 12px;
    font: inherit; font-size: 14.5px; font-weight: 600; color: var(--ink-2);
    cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
    white-space: nowrap; flex-shrink: 0;
  }
  nav button:hover { color: var(--ink); }
  nav button:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 3px; }
  nav button.on { color: var(--blue); border-bottom-color: var(--blue); }
  nav button .t-code { font-weight: 800; margin-right: 6px; font-variant-numeric: tabular-nums; }

  .summary {
    display: flex; flex-wrap: wrap; row-gap: 6px;
    margin: 20px 0 16px; font-size: 13.5px; color: var(--ink-2);
  }
  .summary .item { white-space: nowrap; display: inline-flex; align-items: baseline; gap: 6px; }
  .summary .item + .item::before {
    content: ""; display: inline-block; width: 1px; height: 11px;
    background: var(--line); margin: 0 12px; align-self: center;
  }
  .summary b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
  .summary .item.lead b { color: var(--blue); }

  .board {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    overflow: hidden;
  }
  .board-scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 11px clamp(9px, 1.8vw, 17px); text-align: left; }
  thead th {
    font-size: 11.5px; font-weight: 700; letter-spacing: 0.03em; color: var(--ink-3);
    border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  tbody td { border-bottom: 1px solid var(--line-soft); }
  tbody tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.rank { font-weight: 700; color: var(--ink-3); }
  tr.top1 td.rank, tr.top1 td.who { color: var(--blue); }
  tr.top1 td.score { color: var(--blue-strong); }
  td.who { font-weight: 600; white-space: nowrap; }
  td.score { font-weight: 700; white-space: nowrap; }
  tr.baseline td { color: var(--ink-3); }
  .tag {
    display: inline-block; font-size: 10.5px; font-weight: 700;
    border: 1px solid var(--line); border-radius: 999px; padding: 1.5px 8px;
    margin-left: 7px; vertical-align: 1.5px; color: var(--ink-3); white-space: nowrap;
  }
  td.memo { color: var(--ink-2); font-size: 13.5px; min-width: 12ch; max-width: 34ch; }
  td.file {
    color: var(--ink-3); font-size: 12px; white-space: nowrap;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  td.date { color: var(--ink-3); font-size: 13px; white-space: nowrap; }
  .empty { padding: 40px 20px; text-align: center; color: var(--ink-2); }

  .below {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 8px 14px; margin: 13px 2px 0;
  }
  .toggle { font-size: 13.5px; color: var(--ink-2); cursor: pointer; user-select: none; }
  .toggle input { accent-color: var(--blue); vertical-align: -2px; margin-right: 7px; }
  .metric-hint { font-size: 12.5px; color: var(--ink-3); }

  .errors { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
  .error-item {
    border: 1px solid color-mix(in srgb, var(--danger) 30%, var(--line));
    border-left: 3px solid var(--danger);
    background: var(--surface);
    border-radius: 8px; padding: 10px 14px; font-size: 13.5px; color: var(--ink-2);
    overflow-wrap: anywhere;
  }
  .error-item b { color: var(--danger); font-weight: 700; margin-right: 8px; }
  .error-item code { font-family: ui-monospace, Menlo, monospace; color: var(--ink); }

  footer {
    margin: 32px 0 52px; padding-top: 16px; border-top: 1px solid var(--line);
    font-size: 12.5px; line-height: 1.7; color: var(--ink-3); max-width: 72ch;
  }
  footer a { color: var(--blue); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  @media (max-width: 760px) {
    th.col-file, td.file { display: none; }
  }
  @media (max-width: 560px) {
    th.col-memo, td.memo { display: none; }
    .summary { font-size: 13px; }
    .summary .item + .item::before { margin: 0 9px; }
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <span class="brand">ChangCv</span>
    <h1>해양과학 AI 경진대회 리더보드</h1>
    <p class="stamp" id="stamp">불러오는 중</p>
    <nav id="tabs" role="tablist" aria-label="문제 선택"></nav>
  </header>

  <section class="summary" id="summary" aria-label="요약"></section>

  <section class="board"><div class="board-scroll">
    <table>
      <thead><tr>
        <th class="num">순위</th><th>제출자</th><th class="num" id="score-head">점수</th>
        <th class="col-memo">메모</th><th class="col-file">파일</th><th>제출</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div></section>

  <div class="below">
    <label class="toggle"><input type="checkbox" id="bestOnly">제출자별 최고 점수만 보기</label>
    <span class="metric-hint" id="metric-hint"></span>
  </div>

  <div class="errors" id="errors"></div>

  <footer>
    채점은 주최측 score.py의 검증 게이트와 지표 수식을 그대로 사용하며, 공식 test 정답이
    비공개이므로 train에서 분리한 팀 검증셋 기준입니다. 기준선 행은 팀 검증셋에서 다시 계산한
    값이라 공식 안내 수치와 다릅니다. 제출 방법은 팀 repo의
    <a href="https://github.com/mango-stop/marin-leaderboard" rel="noopener">README</a>를 참고하세요.
  </footer>
</div>

<script>
const TASKS = ["P1", "P2", "P3"];
let board = null, current = "P1";

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
const f6 = v => v.toFixed(6);
const shortTime = iso => iso.slice(5, 16).replace("T", " ");

function render() {
  const t = board.tasks[current];
  const bestOnly = document.getElementById("bestOnly").checked;
  const unit = t.unit ? ` (${t.unit})` : "";
  document.getElementById("score-head").textContent = t.metric + unit;
  document.getElementById("metric-hint").textContent =
    `${t.metric}${unit} · ${t.higher_better ? "높을수록" : "낮을수록"} 좋음`;

  const best = new Set(t.best_by_submitter);
  const ok = t.entries.filter(e => e.status === "ok")
    .sort((a, b) => a.rank - b.rank)
    .filter(e => !bestOnly || best.has(e.file));
  const rows = document.getElementById("rows");
  rows.innerHTML = "";
  if (!ok.length) {
    rows.innerHTML = `<tr><td colspan="6" class="empty">아직 제출이 없습니다 —
      팀 repo의 submissions/${current}/ 에 CSV를 push 하세요.</td></tr>`;
  }
  for (const e of ok) {
    const tr = document.createElement("tr");
    if (e.rank === 1) tr.classList.add("top1");
    if (e.is_baseline) tr.classList.add("baseline");
    tr.innerHTML =
      `<td class="num rank">${e.rank}</td>` +
      `<td class="who">${esc(e.submitter)}${e.is_baseline ? '<span class="tag">기준선</span>' : ""}</td>` +
      `<td class="num score">${f6(e.score)}</td>` +
      `<td class="memo">${esc(e.memo || "")}</td>` +
      `<td class="file">${esc(e.file)}</td>` +
      `<td class="date">${shortTime(e.submitted_at)}</td>`;
    rows.appendChild(tr);
  }

  document.getElementById("errors").innerHTML =
    t.entries.filter(e => e.status === "error").map(e =>
      `<div class="error-item"><b>채점 실패</b><code>${esc(e.file)}</code> — ${esc(e.error)}</div>`
    ).join("");

  const okReal = t.entries.filter(e => e.status === "ok" && !e.is_baseline);
  const baseline = t.entries.find(e => e.is_baseline && e.status === "ok");
  const top = t.entries.filter(e => e.status === "ok").find(e => e.rank === 1);
  document.getElementById("summary").innerHTML =
    `<span class="item lead">1위 <b>${top ? f6(top.score) : "–"}</b>${top ? esc(top.submitter) : ""}</span>` +
    `<span class="item">팀 기준선 <b>${baseline ? f6(baseline.score) : "–"}</b></span>` +
    `<span class="item">공식 기준선 <b>${t.official_baseline}</b></span>` +
    `<span class="item">제출 <b>${okReal.length}</b>건</span>`;
}

function selectTab(task) {
  current = task;
  document.querySelectorAll("#tabs button").forEach(b =>
    b.classList.toggle("on", b.dataset.task === task));
  render();
}

async function init() {
  try {
    board = await (await fetch("leaderboard.json?_=" + Date.now())).json();
  } catch (e) {
    document.getElementById("stamp").textContent =
      "leaderboard.json을 불러오지 못했습니다 — 첫 채점 실행 전이거나 배포 오류입니다.";
    return;
  }
  document.getElementById("stamp").innerHTML =
    `마지막 갱신 <b>${board.generated_at.slice(0, 16).replace("T", " ")}</b> KST · 자동 채점`;
  const tabs = document.getElementById("tabs");
  for (const task of TASKS) {
    const t = board.tasks[task];
    if (!t) continue;
    const b = document.createElement("button");
    b.dataset.task = task;
    b.setAttribute("role", "tab");
    b.innerHTML = `<span class="t-code">${task}</span>${esc(t.name)}`;
    b.onclick = () => selectTab(task);
    tabs.appendChild(b);
  }
  document.getElementById("bestOnly").onchange = render;
  selectTab("P1");
}
init();
</script>
</body>
</html>
